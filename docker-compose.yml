name: microservices-deployment

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres123"
      POSTGRES_DB: skill_exam_2400031485

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skill_exam_2400031485"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - microservices-network

  exam-service:
    image: srishanthreddy18/docker-skill-exam-2400031485:latest

    build:
      context: .
      dockerfile: Dockerfile

    container_name: exam-service

    ports:
      - "1485:8004"

    depends_on:
      postgresdb:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/skill_exam_2400031485
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "postgres123"

    restart: unless-stopped

    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge